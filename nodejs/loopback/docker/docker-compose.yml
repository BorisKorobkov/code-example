version: "3.7"

networks:
  intranet:
    attachable: true
  web:
    external: true

# Volumes are stored in /var/lib/docker/volumes/
volumes:
  postgres:

services:
  ###################
  # Node.js
  ###################
  nodejs:
    image: boriskorobkov/loopback:dev # ./Dockerfile
    volumes:
      - ../node:/home/node
    networks:
      - intranet
      - web
    depends_on:
      - postgres
    entrypoint: [ "/bin/sh", "-c", "npm start" ]

  ###################
  # DB
  ###################
  postgres:
    image: postgres:alpine # https://hub.docker.com/_/postgres
    restart: always
    volumes:
      - postgres:/var/lib/postgresql/data
    #      - ./db/init.sql:/docker-entrypoint-initdb.d/create_tables.sql
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - intranet

  ###################
  # Adminer
  ###################
  adminer:
    image: adminer # https://hub.docker.com/_/adminer
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    networks:
      - intranet
      - web
