version: '3.7'

volumes:
  mysql:

networks:
  net:
    driver: bridge
    attachable: false
  web:
    external: false

# Used in Docker swarm only. https://docs.docker.com/engine/swarm/
x-deploy: &deploy
  deploy:
    mode: replicated
    replicas: 1
    restart_policy:
      max_attempts: 3
      condition: any
      delay: 60s
    update_config:
      parallelism: 1
      delay: 10s
      order: start-first

# Used in Traefik only. https://traefik.io/
x-labels:
  - &traefik1 traefik.docker.network=web
  - &traefik2 traefik.enable=true

services:
  # Nginx
  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../src_php/:/var/www/
    networks:
      - net
      - web
    labels:
      - traefik.http.routers.code-example-${TRAEFIK_NAMESPACE}.rule=Host("code-example.${URL_NAMESPACE}.korobkov.su")
      - traefik.http.routers.code-example-${TRAEFIK_NAMESPACE}.entrypoints=websecure
      - traefik.http.routers.code-example-${TRAEFIK_NAMESPACE}.tls.certresolver=le
      - traefik.http.services.code-example-${TRAEFIK_NAMESPACE}.loadbalancer.server.port=80
      - *traefik1
      - *traefik2
    <<: *deploy

  # PHP
  php:
    container_name: php
    image: boriskorobkov/code-example-mvc:latest
    environment:
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    working_dir: /var/www/
    networks:
      - net
    <<: *deploy

  # DB
  db:
    container_name: db
    image: mariadb:latest
    volumes:
      - mysql:/var/lib/mysql
      - ../src_php/migrations:/docker-entrypoint-initdb.d # migrations
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8 --collation-server=utf8_general_ci --default-storage-engine=InnoDB
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - net
    <<: *deploy

  # Adminer
  adminer:
    container_name: adminer
    image: adminer
    environment:
      - ADMINER_DEFAULT_SERVER=db
    networks:
      - net
      - web
    labels:
      - traefik.http.routers.adminer-${TRAEFIK_NAMESPACE}.rule=Host("adminer.${URL_NAMESPACE}.korobkov.su")
      - traefik.http.routers.adminer-${TRAEFIK_NAMESPACE}.entrypoints=websecure
      - traefik.http.routers.adminer-${TRAEFIK_NAMESPACE}.tls.certresolver=le
      - traefik.http.services.adminer-${TRAEFIK_NAMESPACE}.loadbalancer.server.port=80
      - *traefik1
      - *traefik2
    <<: *deploy
