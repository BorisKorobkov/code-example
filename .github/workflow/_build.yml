name: Build docker image

on:
  workflow_call:

    inputs:
      APP_PATH:
        description: "Path to the app"
        required: false
        default: "src/"
        type: string
      CONTEXT:
        description: "Context path for Dockerfile"
        required: false
        default: "src/"
        type: string
      DOCKERFILE:
        description: "Path to Dockerfile"
        required: false
        default: "docker/Dockerfile"
        type: string
      TARGET:
        description: "Dockerfile target. For example: prod"
        required: false
        default: ""
        type: string
      VERSION_FROM_TAG:
        description: "Serial number of '/' in git tag. For example: tag is ':refs/tags/QAT/VERSION'. 4 - VERSION"
        required: false
        default: 4
        type: number
      DOCKERHUB_REPO:
        description: "Dockerhub repo ${DOCKERHUB_REPO}:${GITHUB_REF:=latest}"
        required: true
        type: string

    secrets:
      # Docker
      DOCKER_REGISTRY:
        required: true
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from git tag. The default value is "latest"
        run: |
          echo "DOCKER_VERSION=$(echo $GITHUB_REF | cut -d / -f ${{ inputs.VERSION_FROM_TAG }} | sed 's/^$/latest/')" >> $GITHUB_ENV
          echo "COMPOSER_VERSION=$(echo $GITHUB_REF | cut -d / -f ${{ inputs.VERSION_FROM_TAG }} | sed "s/^\$/`date +"%Y.%m.%d"`-latest/")" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v2

      - name: Inject version into composer.json
        working-directory: ${{ inputs.APP_PATH }}
        run: jq --arg a "${{ env.COMPOSER_VERSION }}" '.version = $a' composer.json > "tmp" && mv "tmp" package.json

      - name: Login to Docker registry
        uses: docker/login-action@v1
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v2
        with:
          context: ${{ inputs.CONTEXT }}
          file: ${{ inputs.DOCKERFILE }}
          target: ${{ inputs.TARGET }}
          tags: ${{ inputs.DOCKERHUB_REPO }}:${{ env.DOCKER_VERSION }}
          push: true
