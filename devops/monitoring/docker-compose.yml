# see yii2/docs/docker.md

networks:
  monitoring:
    external: true
  web:
    external: true

x-labels:
  - &traefik-network "traefik.docker.network=web"
  - &traefik-disable "traefik.enable=false"
  - &traefik-enable "traefik.enable=true"

services:

  # Crowdsec
  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8-slim
    restart: always
    volumes:
      - ./crowdsec/config/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./crowdsec/parsers/nginx-json.yaml:/etc/crowdsec/parsers/s01-parse/nginx-json.yaml:ro
      - ./crowdsec/scenarios/black-bot.yaml:/etc/crowdsec/scenarios/black-bot.yaml:ro
      - ./crowdsec/scenarios/gray-bot.yaml:/etc/crowdsec/scenarios/gray-bot.yaml:ro
      - ../../volumes/crowdsec:/var/lib/crowdsec
      - ../../volumes/nginx/logs:/var/log/nginx:ro
    environment:
      COLLECTIONS: "crowdsecurity/nginx"
      METRICS_PORT: "6060"
      BOUNCER_KEY_traefik_bouncer: ${CROWDSEC_BOUNCER_KEY:-}
    networks:
      - monitoring
      - web
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -tuln | grep -q ':::8080'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    labels:
      - *traefik-disable

  # Crowdsec blocklist import
  crowdsec-blocklist-import:
    image: ghcr.io/wolffcatskyy/crowdsec-blocklist-import:3.6.0
    restart: always
    environment:
      CROWDSEC_LAPI_URL: http://crowdsec:8080
      CROWDSEC_LAPI_KEY: ${CROWDSEC_BOUNCER_KEY:-}
    depends_on:
      - crowdsec
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "test -d /proc/1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    labels:
      - *traefik-disable

  # Filebeat
  filebeat:
    image: elastic/filebeat:9.4.2
    restart: always
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../../volumes/nginx/logs:/var/log/nginx:ro
    command: ["--environment", "container"]
    networks:
      - monitoring
    depends_on:
      logstash:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "cat /proc/net/tcp | grep -q ':0000' "]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    labels:
      - *traefik-disable

  # Logstash
  logstash:
    image: logstash:9.4.2
    restart: always
    environment:
      - LS_JAVA_OPTS=-Xmx256m -Xms256m
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    networks:
      - monitoring
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:9600/_node/pipelines"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - *traefik-disable

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:9.4.2
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - ../../volumes/elasticsearch:/usr/share/elasticsearch/data:rw
      - ./elasticsearch/pipelines:/pipelines:ro
    entrypoint: ["/usr/local/bin/init.sh"]
    command: []
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - *traefik-disable

  # Node Exporter
  node_exporter:
    image: prom/node-exporter:v1.11.1
    restart: always
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -tuln | grep -q ':::9100'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    labels:
      - *traefik-disable

  # Prometheus
  prometheus:
    image: prom/prometheus:v3.12.0
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring
    depends_on:
      node_exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -tuln | grep -q ':::9090'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    labels:
      - *traefik-disable

  # Grafana
  grafana:
    image: grafana/grafana:13.0.2-ubuntu
    restart: always
    volumes:
      - ../../volumes/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      GF_SERVER_ROOT_URL: https://grafana.korobkov.su/
    networks:
      - monitoring
      - web
    depends_on:
      elasticsearch:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    user: root
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.http.routers.grafana.rule=Host(`grafana.korobkov.su`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=${CERTRESOLVER:-}"
      - "traefik.http.routers.grafana.middlewares=traefik-compress,auth"
      - *traefik-network
      - *traefik-enable
